name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -c constraints.txt -e '.[dev]'
      - run: ruff check src tests scripts
      - run: pytest -q
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c constraints.txt -e '.[dev,chain]'
      - run: python -c 'import solcx; solcx.install_solc("0.8.30")'
      - run: RUN_CHAIN_TESTS=1 pytest tests/test_contract.py -q
