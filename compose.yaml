services:
  app:
    build: .
    environment:
      APP_DEMO: "1"
    command: ["sh", "-c", "python -c 'from trade_desk.store import Store; from trade_desk.seed import seed; seed(Store(\"/data/trades.db\"))' && uvicorn trade_desk.api:app --host 0.0.0.0 --port 8101"]
    ports:
      - "127.0.0.1:8101:8101"
    volumes:
      - data:/data
    restart: unless-stopped
volumes:
  data:
